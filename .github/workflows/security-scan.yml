name: Security Scanning Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner (Docker)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run Bandit (SAST - finds command injection)
        run: bandit -r app.py -f json -o bandit-results.json || true

      - name: Run pip audit (Dependency vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit || true

      - name: Check for security issues
        run: |
          echo "=== Bandit Results ==="
          if [ -f bandit-results.json ]; then
            python -m json.tool bandit-results.json
          fi

  block-on-critical:
    runs-on: ubuntu-latest
    needs: security-scan
    if: failure()
    steps:
      - name: Block merge due to security findings
        run: |
          echo "❌ Security scan failed - merge blocked"
          exit 1
